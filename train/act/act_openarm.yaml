# ACT baseline for lerobot_data_20260831.
#
# Run train_act_new.py from the real_robot project root. The raw dataset is read-only.
# train_act_new.py converts every camera frame to [3, 240, 320] with aspect-ratio
# preserving letterbox padding before ACT's visual normalization.

dataset:
  repo_id: local/lerobot_data_20260831
  root: /mnt/data/nas/hufangchi/projects/real_robot/lerobot_data_20260831
  use_imagenet_stats: true
  streaming: false
  image_transforms:
    # train_act_new.py attaches the custom letterbox callable after official dataset creation.
    enable: false

policy:
  type: act
  device: cuda
  use_amp: true
  push_to_hub: false

  input_features:
    "observation.state":
      type: STATE
      shape: [16]
    "observation.images.left":
      type: VISUAL
      shape: [3, 240, 320]
    "observation.images.right":
      type: VISUAL
      shape: [3, 240, 320]
    "observation.images.head":
      type: VISUAL
      shape: [3, 240, 320]

  output_features:
    action:
      type: ACTION
      shape: [16]

  # 32 frames at 30 Hz predicts one second of future absolute position targets.
  chunk_size: 32
  # Temporal ensembling requires a fresh policy query at every control step.
  n_action_steps: 1
  temporal_ensemble_coeff: 0.01

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  use_vae: true
  kl_weight: 10.0

output_dir: /mnt/data/nas/hufangchi/projects/real_robot/train/outputs/act/act_openarm_20260831
job_name: act_openarm_20260831
seed: 1000

batch_size: 32
num_workers: 8
prefetch_factor: 2
persistent_workers: true
steps: 100000
log_freq: 100
env_eval_freq: 0
save_checkpoint: true
save_freq: 10000

wandb:
  enable: false
  disable_artifact: true
